name = "social-rss-bridge"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 智能部署 — 自动选择最优地域
[placement]
mode = "smart"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "social-rss-bridge-db"
database_id = "ad708151-17c0-4cab-a4ee-a41033160154"
migrations_dir = "migrations"

# Cron Triggers — 每小时刷新缓存
[triggers]
crons = ["0 * * * *"]

[vars]
CACHE_TTL_MINUTES = "60"
BASE_URL = "https://social-rss-bridge.xiaoan.workers.dev"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# Secrets (通过 wrangler secret put 设置，不进代码仓库):
# TIKHUB_API_TOKEN    - TikHub API Bearer Token (小红书数据抓取)
# TELEGRAM_BOT_TOKEN  - Telegram Bot Token
# TELEGRAM_CHAT_ID    - Telegram 接收消息的 Chat ID
# ADMIN_TOKEN         - 管理接口鉴权 Token
