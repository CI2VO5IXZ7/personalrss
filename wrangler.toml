name = "social-rss-bridge"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 智能部署 — 自动选择最优地域
[placement]
mode = "smart"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "social-rss-bridge-db"
database_id = "ad708151-17c0-4cab-a4ee-a41033160154"
migrations_dir = "migrations"

# Cron Triggers — 每 10 分钟触发一次以刷新 Generator 缓存
[triggers]
crons = ["*/10 * * * *"]

[vars]
CACHE_MAX_POSTS = "100"
BASE_URL = "https://social-rss-bridge.xiaoan.workers.dev"
REFRESH_CONCURRENCY = "3"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# Secrets (通过 wrangler secret put 设置，不进代码仓库):
# ADMIN_TOKEN - Web 管理界面与 API 的 Bearer 鉴权 Token
