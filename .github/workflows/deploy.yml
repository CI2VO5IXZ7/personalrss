name: Deploy Worker
on:
  workflow_dispatch:
    inputs:
      management_smoke_command:
        description: 'Management smoke command to run'
        type: choice
        required: true
        default: '/help'
        options:
          - '/help'
          - '/monitor_add'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PUSH_TELEGRAM_BOT_TOKEN: ${{ secrets.PUSH_TELEGRAM_BOT_TOKEN }}
      PUSH_TELEGRAM_CHANNEL_ID: ${{ secrets.PUSH_TELEGRAM_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check
        run: npm run check

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Apply D1 Migrations
        run: npx wrangler d1 migrations apply social-rss-bridge-db --remote

      - name: Deploy
        run: npx wrangler deploy

      - name: Sync Worker Secrets
        shell: bash
        run: |
          set -euo pipefail

          required_secrets=(
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
            TELEGRAM_ADMIN_USER_ID
            ADMIN_TOKEN
            DEEPSEEK_API_KEY
            PUSH_TELEGRAM_BOT_TOKEN
            PUSH_TELEGRAM_CHANNEL_ID
          )
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done
          if (( ${#missing_secrets[@]} > 0 )); then
            printf 'Missing required Worker secrets: %s\n' "${missing_secrets[*]}" >&2
            exit 1
          fi

          node --input-type=module <<'NODE' | npx wrangler secret bulk
          const names = [
            'TELEGRAM_BOT_TOKEN',
            'TELEGRAM_CHAT_ID',
            'TELEGRAM_ADMIN_USER_ID',
            'ADMIN_TOKEN',
            'DEEPSEEK_API_KEY',
            'PUSH_TELEGRAM_BOT_TOKEN',
            'PUSH_TELEGRAM_CHANNEL_ID',
          ];
          const values = Object.fromEntries(names.map(name => [name, process.env[name]]));
          process.stdout.write(JSON.stringify(values));
          NODE

      - name: Validate Management Telegram Bot
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          if ! http_status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe"
          )"; then
            printf '{"stage":"getMe","status":null,"message":"Telegram getMe transport request failed"}\n' >&2
            exit 1
          fi

          TELEGRAM_RESPONSE_FILE="$response_file" HTTP_STATUS="$http_status" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          let payload = null;
          try {
            payload = JSON.parse(fs.readFileSync(process.env.TELEGRAM_RESPONSE_FILE, 'utf8'));
          } catch {}
          if (!/^2\d\d$/.test(process.env.HTTP_STATUS) || !payload || payload.ok !== true || !payload.result?.id) {
            const status = Number(process.env.HTTP_STATUS) || null;
            process.stderr.write(`${JSON.stringify({ stage: 'getMe', status, message: 'Management Telegram bot validation failed' })}\n`);
            process.exit(1);
          }
          process.stdout.write(`${JSON.stringify({ stage: 'getMe', botId: payload.result.id, username: payload.result.username || null })}\n`);
          NODE

      - name: Setup Telegram Webhook
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="$(
            node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const toml = fs.readFileSync('wrangler.toml', 'utf8');
          const match = toml.match(/^BASE_URL\s*=\s*("(?:[^"\\]|\\.)*")\s*(?:#.*)?$/m);
          if (!match) throw new Error('BASE_URL is missing or is not a quoted TOML string');
          const baseUrl = JSON.parse(match[1]);
          const parsed = new URL(baseUrl);
          if (parsed.protocol !== 'https:') throw new Error('BASE_URL must use HTTPS');
          process.stdout.write(parsed.href.replace(/\/$/, ''));
          NODE
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          max_attempts=10
          retry_delay_seconds=3

          print_safe_setup_failure() {
            HTTP_STATUS="$1" node --input-type=module - "$response_file" <<'NODE'
          import fs from 'node:fs';

          let payload = null;
          try {
            payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch {}

          const allowedStages = new Set(['setWebhook', 'setMyCommands']);
          const hasSafePayload = process.env.HTTP_STATUS !== '0' && payload?.ok === false && allowedStages.has(payload.stage);
          const stage = hasSafePayload ? payload.stage : 'setup-webhook';
          const telegramStatus = hasSafePayload && Number.isInteger(payload.status) ? payload.status : null;
          const httpStatus = Number(process.env.HTTP_STATUS) || null;
          const status = telegramStatus ?? httpStatus;
          let message = hasSafePayload && typeof payload.message === 'string'
            ? payload.message.slice(0, 300)
            : 'Telegram webhook setup failed';
          for (const secret of [process.env.ADMIN_TOKEN, process.env.TELEGRAM_BOT_TOKEN]) {
            if (secret) message = message.split(secret).join('***');
          }
          const diagnostic = { stage, status, message };
          process.stderr.write(`${JSON.stringify(diagnostic)}\n`);
          NODE
          }

          for (( attempt=1; attempt<=max_attempts; attempt++ )); do
            if ! http_status="$(
              curl --silent --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer ${ADMIN_TOKEN}" \
                "${BASE_URL}/setup-webhook"
            )"; then
              print_safe_setup_failure "0"
              exit 1
            fi

            if [[ "$http_status" =~ ^2[0-9][0-9]$ ]]; then
              break
            fi

            if [[ "$http_status" == "401" || "$http_status" =~ ^5[0-9][0-9]$ ]]; then
              if (( attempt == max_attempts )); then
                print_safe_setup_failure "$http_status"
                exit 1
              fi
              printf 'Webhook setup returned retryable HTTP status %s; retrying (%d/%d).\n' \
                "$http_status" "$attempt" "$max_attempts" >&2
              sleep "$retry_delay_seconds"
              continue
            fi

            printf 'Webhook setup failed with non-retryable HTTP status %s.\n' "$http_status" >&2
            exit 1
          done

          WEBHOOK_RESPONSE_FILE="$response_file" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.env.WEBHOOK_RESPONSE_FILE, 'utf8'));
          if (payload.webhook?.ok !== true || payload.commands?.ok !== true) {
            throw new Error('Telegram webhook or command setup API reported failure');
          }
          NODE

          if ! info_status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo"
          )"; then
            printf '{"stage":"getWebhookInfo","status":null,"message":"Telegram getWebhookInfo transport request failed"}\n' >&2
            exit 1
          fi

          WEBHOOK_INFO_FILE="$response_file" HTTP_STATUS="$info_status" BASE_URL="$BASE_URL" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          let payload = null;
          try {
            payload = JSON.parse(fs.readFileSync(process.env.WEBHOOK_INFO_FILE, 'utf8'));
          } catch {}

          const expected = `${process.env.BASE_URL}/telegram`;
          const actual = payload?.result?.url || '';
          if (!/^2\d\d$/.test(process.env.HTTP_STATUS) || payload?.ok !== true || actual !== expected) {
            const status = Number(process.env.HTTP_STATUS) || null;
            process.stderr.write(`${JSON.stringify({ stage: 'getWebhookInfo', status, message: 'Telegram webhook URL verification failed' })}\n`);
            process.exit(1);
          }
          process.stdout.write(`${JSON.stringify({ stage: 'getWebhookInfo', webhookHost: new URL(actual).host, webhookPath: new URL(actual).pathname })}\n`);
          NODE

      - name: Verify Management Telegram Delivery
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --silent --show-error --fail-with-body \
            --output "$response_file" \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ PersonalRSS management bot deployment smoke test passed." \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

          TELEGRAM_RESPONSE_FILE="$response_file" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.env.TELEGRAM_RESPONSE_FILE, 'utf8'));
          if (payload.ok === true && payload.result?.message_id) {
            // success
          } else {
            throw new Error('Management Telegram smoke test reported failure');
          }
          NODE

      - name: Verify Management Command
        env:
          MANAGEMENT_SMOKE_COMMAND: ${{ inputs.management_smoke_command || '/help' }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="$(
            node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const toml = fs.readFileSync('wrangler.toml', 'utf8');
          const match = toml.match(/^BASE_URL\s*=\s*("(?:[^"\\]|\\.)*")\s*(?:#.*)?$/m);
          if (!match) throw new Error('BASE_URL is missing or is not a quoted TOML string');
          const baseUrl = JSON.parse(match[1]);
          const parsed = new URL(baseUrl);
          if (parsed.protocol !== 'https:') throw new Error('BASE_URL must use HTTPS');
          process.stdout.write(parsed.href.replace(/\/$/, ''));
          NODE
          )"

          SECRET="$(
            node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const secret = crypto.createHash("sha256").update(process.env.ADMIN_TOKEN,"utf8").digest("hex");
          process.stdout.write(secret);
          NODE
          )"

          payload_file="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$payload_file" "$response_file"' EXIT

          PAYLOAD_FILE="$payload_file" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = {
            message: {
              chat: { id: Number(process.env.TELEGRAM_CHAT_ID), type: "private" },
              from: { id: Number(process.env.TELEGRAM_ADMIN_USER_ID) },
              text: process.env.MANAGEMENT_SMOKE_COMMAND
            }
          };
          fs.writeFileSync(process.env.PAYLOAD_FILE, JSON.stringify(payload));
          NODE

          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Telegram-Bot-Api-Secret-Token: ${SECRET}" \
            --data-binary "@$payload_file" \
            --output "$response_file" \
            "${BASE_URL}/telegram"

          RESPONSE_FILE="$response_file" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = fs.readFileSync(process.env.RESPONSE_FILE, 'utf8');
          if (response !== 'ok') {
            throw new Error('Telegram management command response was not ok');
          }
          NODE

      - name: Verify Push Telegram Delivery
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --silent --show-error --fail-with-body \
            --output "$response_file" \
            --request POST \
            --data-urlencode "chat_id=${PUSH_TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=✅ PersonalRSS production deployment smoke test passed." \
            "https://api.telegram.org/bot${PUSH_TELEGRAM_BOT_TOKEN}/sendMessage"

          TELEGRAM_RESPONSE_FILE="$response_file" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync(process.env.TELEGRAM_RESPONSE_FILE, 'utf8'));
          if (payload.ok !== true || !payload.result?.message_id) {
            throw new Error('Push Telegram smoke test reported failure');
          }
          NODE
